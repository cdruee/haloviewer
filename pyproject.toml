[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "haloviewer"
dynamic = ["version"]
description = "Viewer, plotting and synchronisation tools for Halo Photonics wind lidar data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Clemens Drüe", email = "druee@uni-trier.de" }
]
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
docs = ["sphinx>=7"]

[project.scripts]
haloviewer = "haloviewer.gui:main"
haloplot = "haloviewer.cli:main"
halosync = "haloviewer.halosync:main"

[tool.setuptools.packages.find]
include = ["haloviewer*"]

# Version number from the git history (tags like "v0.2.0" or "0.2.0").
# Written to haloviewer/_version.py at build/install time; that file is
# generated and must not be edited or committed.
[tool.setuptools_scm]
version_file = "haloviewer/_version.py"
# used when no git metadata is available (e.g. installing from a zip)
fallback_version = "0.1.0"
