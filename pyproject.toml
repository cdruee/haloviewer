[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haloviewer"
version = "0.1.0"
description = "Viewer and plotting tools for Halo Photonics wind lidar data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Clemens Drüe", email = "druee@uni-trier.de" }
]
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
haloviewer = "haloviewer.gui:main"
haloplot = "haloviewer.cli:main"

[tool.setuptools.packages.find]
include = ["haloviewer*"]
